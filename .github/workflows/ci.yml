name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: cryohealth
          POSTGRES_PASSWORD: cryohealth-dev
          POSTGRES_DB: cryohealth
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U cryohealth"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run migration:run
      - run: npm test
