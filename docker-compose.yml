services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: cryohealth
      POSTGRES_PASSWORD: cryohealth-dev
      POSTGRES_DB: cryohealth
    ports:
      - '5433:5432' # 5433 on the host: leaves room for a locally installed Postgres on 5432
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cryohealth']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    profiles: ['full'] # `docker compose up -d db` for dev; `--profile full up` for the whole stack
    environment:
      DB_HOST: db
      JWT_SECRET: change-me-in-prod
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
